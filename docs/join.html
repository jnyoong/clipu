<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clipu 초대</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #F9FAFB;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 40px 32px;
      text-align: center;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .logo {
      font-size: 36px;
      font-weight: 700;
      color: #2563EB;
      margin-bottom: 8px;
    }
    .title {
      font-size: 18px;
      font-weight: 600;
      color: #111;
      margin-bottom: 8px;
    }
    .desc {
      font-size: 14px;
      color: #888;
      margin-bottom: 32px;
      line-height: 1.5;
    }
    .btn {
      display: block;
      background: #2563EB;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      padding: 16px;
      border-radius: 12px;
      text-decoration: none;
      margin-bottom: 12px;
    }
    .hint {
      font-size: 12px;
      color: #bbb;
      margin-top: 20px;
    }
    .error {
      font-size: 14px;
      color: #EF4444;
      margin-top: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Clipu</div>
    <div class="title">공유 클립에 초대됐어요!</div>
    <div class="desc">아래 버튼을 눌러 Clipu 앱에서 참여하세요.</div>
    <a id="openBtn" href="#" class="btn">Clipu 앱에서 열기</a>
    <div class="hint">Clipu 앱이 설치되어 있어야 해요.</div>
    <div class="error" id="errorMsg">앱이 설치되어 있지 않은 것 같아요. Clipu 앱을 먼저 설치해주세요.</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');

    if (code) {
      const deepLink = 'clipu://join/' + code;
      document.getElementById('openBtn').href = deepLink;

      // 자동 실행 시도
      setTimeout(function() {
        window.location.href = deepLink;
      }, 300);

      // 앱 없을 경우 안내
      setTimeout(function() {
        if (!document.hidden) {
          document.getElementById('errorMsg').style.display = 'block';
        }
      }, 2000);
    } else {
      document.getElementById('openBtn').style.display = 'none';
      document.querySelector('.desc').textContent = '유효하지 않은 초대 링크예요.';
    }
  </script>
</body>
</html>
